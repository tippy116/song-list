<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歌えるものリスト</title>
  <style>
    :root {
      --bg-color: #e8f4f8;
      --card-bg: rgba(255, 255, 255, 0.75);
      --accent-color: #7bbcd5;
      --text-color: #4a5568;
      --text-light: #718096;
      --border-radius: 12px;
      --glass-shadow: 0 8px 32px 0 rgba(123, 188, 213, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 10% 10%, rgba(255, 255, 255, 0.9) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(200, 230, 242, 0.6) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-color);
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding: 15px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #3182ce;
      letter-spacing: 1px;
      display: inline-block;
    }

    h1::before, h1::after {
      content: '⭐️';
      font-size: 1.2rem;
      margin: 0 8px;
    }

    .filter-panel {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--glass-shadow);
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 768px) {
      .search-row {
        grid-template-columns: 1fr;
      }
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid rgba(123, 188, 213, 0.4);
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      font-size: 0.9rem;
      color: var(--text-color);
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 8px rgba(123, 188, 213, 0.3);
    }

    .filter-section-title {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 6px;
      font-weight: bold;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(123, 188, 213, 0.3);
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-color);
      transition: all 0.2s ease;
    }

    .btn:hover, .btn.active {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .song-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--border-radius);
      padding: 15px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .song-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #2d3748;
    }

    .song-artist {
      font-size: 0.8rem;
      color: var(--text-light);
    }

    .meta-info {
      font-size: 0.75rem;
      color: #718096;
      margin-top: 2px;
    }

    .song-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }

    .tag {
      font-size: 0.7rem;
      background: rgba(123, 188, 213, 0.2);
      color: #2b6cb0;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .loading, .no-results {
      text-align: center;
      padding: 40px;
      grid-column: 1 / -1;
      color: var(--text-light);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>歌えるものリスト</h1>
    </header>

    <div class="filter-panel">
      <!-- 検索窓（曲名・アーティスト・アニメ名） -->
      <div class="search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="曲名やアーティスト名で検索...">
        <input type="text" id="animeSearchInput" class="search-input" placeholder="アニメタイトルで検索...">
      </div>

      <!-- 五十音順フィルタ -->
      <div>
        <div class="filter-section-title">五十音で探す</div>
        <div class="btn-group" id="initialGroup">
          <button class="btn active" data-initial="all">すべて</button>
          <button class="btn" data-initial="あ">あ</button>
          <button class="btn" data-initial="か">か</button>
          <button class="btn" data-initial="さ">さ</button>
          <button class="btn" data-initial="た">た</button>
          <button class="btn" data-initial="な">な</button>
          <button class="btn" data-initial="は">は</button>
          <button class="btn" data-initial="ま">ま</button>
          <button class="btn" data-initial="や">や</button>
          <button class="btn" data-initial="ら">ら</button>
          <button class="btn" data-initial="わ">わ</button>
        </div>
      </div>

      <!-- カテゴリフィルタ -->
      <div>
        <div class="filter-section-title">カテゴリーで探す</div>
        <div class="btn-group" id="categoryGroup">
          <button class="btn active" data-category="all">すべて</button>
          <button class="btn" data-category="春">春</button>
          <button class="btn" data-category="夏">夏</button>
          <button class="btn" data-category="秋">秋</button>
          <button class="btn" data-category="冬">冬</button>
          <button class="btn" data-category="かわいい">かわいい</button>
          <button class="btn" data-category="かっこいい">かっこいい</button>
          <button class="btn" data-category="しっとり">しっとり</button>
          <button class="btn" data-category="元気">元気</button>
          <button class="btn" data-category="Key">Key</button>
          <button class="btn" data-category="ボカロ">ボカロ</button>
          <button class="btn" data-category="平成">平成</button>
          <button class="btn" data-category="令和">令和</button>
        </div>
      </div>

      <!-- 年代（年代別）フィルタ -->
      <div>
        <div class="filter-section-title">年代で探す</div>
        <div class="btn-group" id="yearGroup">
          <button class="btn active" data-year="all">すべて</button>
          <button class="btn" data-year="2020年代">2020年代</button>
          <button class="btn" data-year="2010年代">2010年代</button>
          <button class="btn" data-year="2000年代">2000年代</button>
          <button class="btn" data-year="1990年代">1990年代</button>
        </div>
      </div>
    </div>

    <!-- 動画リスト表示エリア -->
    <div class="song-grid" id="songGrid">
      <div class="loading">スプレッドシートからデータを読み込み中...☁️</div>
    </div>
  </div>

  <script>
    // ★ここにスプレッドシートのCSV URLを設定してください★
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS-j2sRMURNNxZbCF44kc5fTXmKcF-YZWF1pCZsB8rfQL4KgMdsbZNxldtK1La2QbzQ2eQkOqUhCBwo/pub?output=csv';

    let allSongs = [];
    let currentInitial = 'all';
    let currentCategory = 'all';
    let currentYear = 'all';

    function parseCSV(text) {
      let lines = [];
      let row = [''];
      let inQuotes = false;
      
      for (let i = 0; i < text.length; i++) {
        let c = text[i];
        let next = text[i+1];
        
        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' && next === '\n') || (c === '\n' && !inQuotes)) {
          if (c === '\r') i++;
          lines.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') {
        lines.push(row);
      }

      if (lines.length < 2) return [];

      let headers = lines[0].map(h => h.trim());
      let result = [];

      for (let i = 1; i < lines.length; i++) {
        let obj = {};
        let currentLine = lines[i];
        for (let j = 0; j < headers.length; j++) {
          obj[headers[j]] = currentLine[j] !== undefined ? currentLine[j].trim() : '';
        }
        if (obj.title && obj.url) {
          result.push(obj);
        }
      }
      return result;
    }

    function getEmbedUrl(url) {
      if (!url) return '';
      if (url.includes('embed/')) return url;
      
      let videoId = '';
      if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split(/[?#]/)[0];
      } else if (url.includes('watch?v=')) {
        videoId = url.split('watch?v=')[1].split('&')[0];
      }
      return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
    }

    async function fetchSongs() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        allSongs = parseCSV(csvText);
        renderSongs();
      } catch (error) {
        console.error(error);
        document.getElementById('songGrid').innerHTML = '<div class="no-results">データの読み込みに失敗しました。</div>';
      }
    }

    // 年代判定用関数（例: "2021" や "2021年" から "2020年代" を判定）
    function matchDecade(songYearVal, targetDecade) {
      if (targetDecade === 'all') return true;
      if (!songYearVal) return false;

      // 文字列から4桁の数字を抽出
      const numMatch = songYearVal.match(/\d{4}/);
      if (!numMatch) return songYearVal === targetDecade; // 数字がない場合は完全一致

      const yearNum = parseInt(numMatch[0], 10);
      if (targetDecade === '2020年代') return yearNum >= 2020 && yearNum <= 2029;
      if (targetDecade === '2010年代') return yearNum >= 2010 && yearNum <= 2019;
      if (targetDecade === '2000年代') return yearNum >= 2000 && yearNum <= 2009;
      if (targetDecade === '1990年代') return yearNum >= 1990 && yearNum <= 1999;

      return songYearVal === targetDecade;
    }

    function renderSongs() {
      const grid = document.getElementById('songGrid');
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const animeSearchText = document.getElementById('animeSearchInput').value.toLowerCase();

      const filtered = allSongs.filter(song => {
        const matchInitial = currentInitial === 'all' || song.initial === currentInitial;
        
        const songCategories = song.category ? song.category.split(',').map(c => c.trim()) : [];
        const matchCategory = currentCategory === 'all' || songCategories.includes(currentCategory);

        // 年代判定
        const matchYear = matchDecade(song.year, currentYear);

        // 部分一致検索
        const matchSearch = !searchText || 
          (song.title && song.title.toLowerCase().includes(searchText)) ||
          (song.artist && song.artist.toLowerCase().includes(searchText));

        const matchAnime = !animeSearchText || 
          (song.anime && song.anime.toLowerCase().includes(animeSearchText));

        return matchInitial && matchCategory && matchYear && matchSearch && matchAnime;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results">該当する曲が見つかりませんでした。</div>';
        return;
      }

      grid.innerHTML = filtered.map(song => {
        const embedUrl = getEmbedUrl(song.url);
        const tags = song.category ? song.category.split(',').map(c => `<span class="tag">${c.trim()}</span>`).join('') : '';

        // 年表記（数字だけ入力されていれば「年」を補完して「2021年」のように綺麗に表示）
        let yearDisplay = song.year || '';
        if (yearDisplay && /^\d{4}$/.test(yearDisplay)) {
          yearDisplay += '年';
        }

        return `
          <div class="song-card">
            <div class="video-container">
              <iframe src="${embedUrl}" allowfullscreen loading="lazy"></iframe>
            </div>
            <div class="song-info">
              <div class="song-title">${song.title}</div>
              <div class="song-artist">${song.artist || ''}</div>
              ${song.anime ? `<div class="meta-info">アニメ: ${song.anime}</div>` : ''}
              ${yearDisplay ? `<div class="meta-info">年代: ${yearDisplay}</div>` : ''}
              <div class="song-tags">${tags}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderSongs);
    document.getElementById('animeSearchInput').addEventListener('input', renderSongs);

    document.querySelectorAll('#initialGroup .btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#initialGroup .btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentInitial = e.target.dataset.initial;
        renderSongs();
      });
    });

    document.querySelectorAll('#categoryGroup .btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#categoryGroup .btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.category;
        renderSongs();
      });
    });

    document.querySelectorAll('#yearGroup .btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#yearGroup .btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentYear = e.target.dataset.year;
        renderSongs();
      });
    });

    fetchSongs();
  </script>
</body>
</html>
